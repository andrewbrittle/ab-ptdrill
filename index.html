<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="UTF-8">
<!-- Never auto-translate: a browser "translate this page" would turn the
     Portuguese answers into English. -->
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Português Drill</title>
<!-- PWA: manifest + icons (Add to Home Screen support) -->
<link rel="manifest" href="manifest-pt.json">
<meta name="theme-color" content="#0f0f0f">
<link rel="icon" href="icons/icon-192.png">
<!-- iOS: Safari ignores the manifest for home-screen installs, needs its own tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PT Drill">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* Android Chrome's "font boosting" (text autosizer) inflates text it judges
     too narrow for its column - it once made the pill row's text look bigger
     when the row changed from wrapping to scrolling. Every font-size here is
     chosen deliberately, so it's turned off everywhere. No effect on desktop. */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

  :root {
    /* Category colours (2026-10-03). */
    --cat-rose:#D98BA5; --cat-teal:#4FB3A9; --cat-wood:#B98553; --cat-sky:#6FC3D9; --cat-lavender:#B79AE0;
    /* Sentence order slots 1-7 (2026-10-09) - the category colours plus two more. */
    --slot-1:#D98BA5; --slot-2:#6FC3D9; --slot-3:#B79AE0; --slot-4:#4FB3A9; --slot-5:#C99563; --slot-6:#8FCB6B; --slot-7:#E3C468;
    --bg: #0f0f0f;
    --surface: #1a1a1a;
    --surface2: #242424;
    /* CRITICAL FIX (2026-09-12): .opt:hover used to hardcode this exact
       value inline instead of a theme variable - harmless here (dark
       text stays light-on-dark either way), but in the light theme below
       the same hardcoded hex put near-black hover text on a near-black
       hover background, making every answer option briefly unreadable on
       hover. Pulled out as a var so each theme can set its own value;
       this one is unchanged from the old hardcoded hex, so dark mode
       looks pixel-identical to before. */
    --opt-hover-bg: #2a2a2a;
    --border: rgba(255,255,255,0.08);
    --border-hover: rgba(255,255,255,0.16);
    --text: #f8f6f2;
    --text-muted: rgba(248,246,242,0.66);
    --text-dim: rgba(248,246,242,0.42);
    --accent: #e8c97a;
    --accent-dim: rgba(232,201,122,0.12);
    --green: #6fcf97;
    --green-dim: rgba(111,207,151,0.12);
    --red: #eb5757;
    --red-dim: rgba(235,87,87,0.12);
    --blue: #7eb8f7;
    --blue-dim: rgba(126,184,247,0.1);
    --purple: #b39ddb;
    --purple-dim: rgba(179,157,219,0.12);
    --radius: 10px;
    --radius-lg: 16px;

    /* Confidence shading - single source of truth for every score-* and
       cat-conf-* rule below (item tiles, numbers/times swatches, category
       swatches), so all three stay in sync automatically instead of each
       repeating the same eight colours on their own. Deliberately not
       overridden in the light theme below - these are meant to read as a
       consistent red/green regardless of theme, the same way they always
       have, not to shift with the surface colours. This is also the one
       place a future "colourblind-friendly palette" setting would need to
       change, if that's ever added. */
    --conf-neg3: rgba(235,87,87,0.45);
    --conf-neg2: rgba(235,87,87,0.30);
    --conf-neg1: rgba(235,87,87,0.15);
    --conf-neutral: rgba(126,184,247,0.14);
    --conf-pos1: rgba(111,207,151,0.15);
    --conf-pos2: rgba(111,207,151,0.30);
    --conf-pos3: rgba(111,207,151,0.45);
    --conf-pos4: rgba(111,207,151,0.60);

    /* Category-tile confidence BAR vars (2026-09-22) - same hue families as
       the --conf-* swatch fills just above, but boosted opacity so a thin
       stacked-bar segment (buildCategoryTile's per-category spread bar)
       reads clearly at a few px tall, where the pale swatch alphas would
       wash out. */
    --conf-neg3-bar: rgba(235,87,87,0.92);
    --conf-neg2-bar: rgba(235,87,87,0.68);
    --conf-neg1-bar: rgba(235,87,87,0.42);
    --conf-neutral-bar: rgba(126,184,247,0.55);
    --conf-pos1-bar: rgba(111,207,151,0.42);
    --conf-pos2-bar: rgba(111,207,151,0.65);
    --conf-pos3-bar: rgba(111,207,151,0.85);
    --conf-pos4-bar: #6fcf97;
    --conf-untested-bar: rgba(255,255,255,0.38);
  }

  /* Light theme - opt-in only via Settings, dark (the :root values above)
     stays the default for everyone unless they switch this on themselves. */
  :root[data-theme="light"] {
    --cat-rose:#B23E63; --cat-teal:#1E7F73; --cat-wood:#8A5A2E; --cat-sky:#2C7A94; --cat-lavender:#6A4FA0;
    --slot-1:#B23E63; --slot-2:#2C7A94; --slot-3:#6A4FA0; --slot-4:#1E7F73; --slot-5:#8A5A2E; --slot-6:#4E8A2C; --slot-7:#9A7A12;
    --bg: #f7f5f0;
    --surface: #ffffff;
    --surface2: #efece4;
    /* See CRITICAL FIX (2026-09-12) above the dark --opt-hover-bg - this is
       the light-theme value that was missing entirely before, which is
       what caused the bug. */
    --opt-hover-bg: #e3ddd0;
    --border: rgba(0,0,0,0.10);
    --border-hover: rgba(0,0,0,0.20);
    --text: #1a1a1a;
    --text-muted: rgba(26,26,26,0.66);
    --text-dim: rgba(26,26,26,0.45);
    --accent: #a9740f;
    --accent-dim: rgba(169,116,15,0.12);
    --green: #2f9e5c;
    --green-dim: rgba(47,158,92,0.12);
    --red: #c53d3d;
    --red-dim: rgba(197,61,61,0.12);
    --blue: #2f6fa8;
    --blue-dim: rgba(47,111,168,0.10);
    --purple: #7856a8;
    --purple-dim: rgba(120,86,168,0.12);

    --conf-neg3-bar: rgba(197,61,61,0.88);
    --conf-neg2-bar: rgba(197,61,61,0.62);
    --conf-neg1-bar: rgba(197,61,61,0.38);
    --conf-neutral-bar: rgba(47,111,168,0.50);
    --conf-pos1-bar: rgba(47,158,92,0.38);
    --conf-pos2-bar: rgba(47,158,92,0.60);
    --conf-pos3-bar: rgba(47,158,92,0.80);
    --conf-pos4-bar: #2f9e5c;
    --conf-untested-bar: rgba(0,0,0,0.30);
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    font-weight: 500;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    background: var(--surface);
  }

  /* The "日本語" in the app's own logo/wordmark was missing this too - same
     audit that turned up the pill bug. */
  .app-heading { font-size: 19px; font-weight: 700; letter-spacing: 0.02em; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .app-heading span { color: var(--accent); }
  /* Cancels the rule above for this one span specifically, so it isn't gold. */
  .app-heading .app-heading-tap { color: var(--text); cursor: pointer; }

  .app-heading-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .head-btns { display: flex; gap: 8px; }
  .nav-row { display: flex; align-items: center; justify-content: flex-start; gap: 8px; }
  .nav-row .nav-pills { flex-shrink: 1; min-width: 0; }
  @media (max-width: 380px) { header { padding-left: 12px !important; padding-right: 12px !important; } .nav-pills { gap: 4px; } .nav-pill { padding: 5px 8px; } }

  .settings-btn {
    flex-shrink: 0;
    width: 30px; height: 30px; border-radius: 99px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-muted); font-size: 15px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.15s;
  }
  .settings-btn:hover { border-color: var(--border-hover); color: var(--text); }
  .settings-btn.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .settings-btn.muted { color: var(--text-dim); }
  /* Hold-to-peek on word tiles (2026-10-02): no iOS copy/Look Up bubble or
     text selection while a card is held. */
  #vocab-tile-grid .kana-ref-card { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  #vocab-tile-grid .kana-ref-card.tile-peeking { border-color: var(--accent); }
  /* Peek bubble - floats above (or beside) the held card, since a finger
     covers the card itself. Never intercepts touches. */
  .tile-peek-bubble {
    position: fixed; z-index: 1000; pointer-events: none;
    background: var(--surface); border: 2px solid var(--accent); border-radius: 12px;
    padding: 10px 14px; text-align: center; max-width: min(78vw, 320px);
    box-shadow: 0 6px 24px rgba(0,0,0,0.45);
  }
  .tile-peek-bubble .peek-jp { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 26px; font-weight: 700; color: var(--text); line-height: 1.25; }
  .tile-peek-bubble .peek-romaji { font-size: 17px; font-weight: 700; color: var(--accent); margin-top: 4px; }
  .tile-peek-bubble .peek-en { font-size: 14px; color: var(--text-muted); margin-top: 3px; }
  /* WHAT'S NEW FLAG (2026-09-01) - green instead of the usual gold .active
     colour, deliberately reusing the same green already used for a correct
     answer elsewhere, so it reads as "something to notice", not an error
     state or a second "active screen" indicator. Cleared (see
     showSettingsScreen()) the moment Settings is actually opened - reading
     the changelog itself is optional, just noticing the cog and tapping it
     is enough to clear it. Mutually exclusive with .active in practice:
     the flag clears in the same click that makes the screen active, so
     the two are never both painting the cog at once. */
  .settings-btn.has-update { background: var(--green-dim); border-color: var(--green); color: var(--green); }

  .nav-pills { display: flex; gap: 6px; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
  .nav-pills::-webkit-scrollbar { display: none; }
  .nav-pill {
    padding: 5px 10px; border-radius: 99px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer;
    transition: all 0.15s; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    white-space: nowrap;
  }
  .nav-pill:hover { border-color: var(--border-hover); color: var(--text); }
  .nav-pill.active { background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  /* Was hardcoded #fff from back when the app was dark-only - white text on
     "Back" stood out fine against a dark pill background, but on the light
     theme it meant white-on-pale (or white-on-white when not also .active),
     unreadable. var(--text) resolves to the same near-white in dark mode
     (#f8f6f2, indistinguishable from #fff) and to dark text in light mode
     (#1a1a1a), so this one line fixes it for both themes without needing a
     separate light-theme override block. */
  .nav-pill.sub-screen { color: var(--text); }

  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 2rem 1rem; }

  .screen { width: 100%; max-width: 480px; display: none; }
  .screen.visible { display: flex; flex-direction: column; gap: 1rem; }

  /* Settings screen. Reused as the reference-page title too (#vocab-ref-title/
     #vocab-tile-selection-title). font-family set here as on .level-pill, so
     headings use the app's own font. */
  /* Back (2026-10-16): top-left of every inner page, naming where it goes. */
  .nav-back { align-self: flex-start; background: none; border: none; padding: 2px 0; margin: 0 0 -0.4rem; font: inherit; font-size: 14px; font-weight: 600; color: var(--accent); cursor: pointer; text-align: left; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nav-back:active { opacity: 0.6; }
  .settings-title { font-size: 22px; font-weight: 700; text-align: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  .settings-sub { font-size: 14px; font-weight: 500; color: var(--text-muted); text-align: center; }

  #match-vocab-view, #match-theme-view, #match-random-view { display: flex; flex-direction: column; gap: 1rem; }

  .group-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 0.875rem 1.25rem;
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; transition: border-color 0.15s;
    user-select: none;
  }
  .group-card:hover { border-color: var(--border-hover); }
  .install-card { align-items: center; gap: 12px; cursor: default; }
  .install-card .install-why { margin-top: 4px; }
  .install-btn { flex-shrink: 0; padding: 8px 16px; border-radius: 99px; border: 1px solid var(--accent); background: var(--accent-dim); color: var(--accent); font-weight: 700; font-size: 13px; cursor: pointer; font-family: inherit; }
  .group-card.selected { border-color: var(--accent); background: var(--accent-dim); }
  /* Used for the "Highlight the meaning instead of sound" toggle specifically
     - while Reversed mode is on, that toggle has no effect (reversed always
     shows English regardless), so it's greyed out and unclickable rather
     than left sitting there looking like it still does something. */
  .group-card.disabled { opacity: 0.35; pointer-events: none; cursor: default; }
  /* Visually secondary but still fully clickable - unlike .disabled above,
     for settings that currently gate nothing, rather than settings that are
     inert while some other condition holds. */
  .group-card.dimmed .group-name { opacity: 0.6; }
  .group-card.dimmed .group-count { opacity: 0.45; }
  .group-card.emphasis { border-color: var(--accent); }
  /* BUG FIX (2026-09-13): see the comment above backup-scores-card in the
     HTML below for the full story - this switches just that one card from
     .group-card's default horizontal row to a column, so the two buttons
     stack under the description instead of squeezing it. */
  #backup-scores-card, #private-vocab-card { flex-direction: column; align-items: stretch; gap: 0.6rem; }

  /* Select all / Random 20 side by side on the tile-selection screen - half
     the vertical space of two full-width cards. When Random 20 is hidden
     (regular, non-theme categories) it's removed from the flex flow entirely,
     so Select all naturally reclaims the full row on its own. */
  .tile-select-actions-row { display: flex; gap: 0.75rem; }
  .tile-select-actions-row .group-card { flex: 1; min-width: 0; padding-left: 1rem; padding-right: 1rem; }
  /* Labels carry numbers now (Select all 45 / Random 20 of 155), so they may wrap on a narrow phone rather than being cut off. */
  .tile-select-actions-row .group-name { white-space: normal; font-size: 14px; line-height: 1.25; }

  .group-info { display: flex; flex-direction: column; gap: 3px; flex: 1; min-width: 0; }

  /* Category-level confidence swatch (whole-category average, excluding
     never-drilled items). Same 8-band thresholds and colours as every other
     confidence display in the app (see confidenceBand) - distinct class
     family (cat-conf-*, not score-*) purely so it can never collide with
     the per-word/per-pool classes on the same element, not because the
     bands or colours themselves differ. Boxed 48x48 side swatch, same shape
     as .score-swatch - a full-card tint was tried first but looked too heavy
     across a long stacked list of categories (the same "too dominating"
     concern the Numbers/Times swatch itself was resized over), so this
     matches that established boxed pattern instead of a full tint. */
  .cat-swatch {
    flex: 0 0 auto; width: 48px; height: 48px; border-radius: var(--radius);
    margin-left: 0.75rem; background: var(--surface2);
  }

  /* Category tile confidence SPREAD BAR (2026-09-22, trial) - replaces the
     single-colour .cat-swatch average blob on the main category-browse
     screen (buildCategoryTile) with a thin per-band stacked bar, so a
     category that's evenly "OK" reads differently from one that's half
     very-good/half very-bad averaging to the same middle colour. Scoped to
     .cat-tile specifically (not .match-card-select generally) so the
     Select-all/Random-20 cards, the Theme tab's static cards, and the "All
     vocabulary" swatch - all of which share .match-card-select
     but are NOT built by buildCategoryTile - are completely untouched by
     this trial. If it earns its keep, .cat-swatch and its cat-conf-* rules
     above become dead code for these tiles (left in place for now since
     other swatch users, e.g. .score-swatch, are unrelated). */
  /* Specificity note: #match-category-list .match-card-select (below)
     is an ID+class rule setting align-items:center for the old row
     layout - a plain .cat-tile class alone can never outrank an ID
     selector, however it's ordered in the file, so this needs to match
     .match-card-select's own ID+class scoping to actually win. */
  #match-category-list .match-card-select.cat-tile { flex-direction: column; align-items: stretch; gap: 0.5rem; padding-top: 1.05rem; padding-bottom: 1.05rem; }
  /* Same restructure for Collections (#match-theme-view) and the
     Numbers/Times/Counters cards below - both use .group-card rather
     than .match-card-select, and .group-card's own base rule (a plain
     class, not ID-scoped) is lower specificity than .group-card.cat-tile
     here, so no ID-scoping trick is needed for this one. */
  .group-card.cat-tile { flex-direction: column; align-items: stretch; gap: 0.5rem; padding-top: 1.05rem; padding-bottom: 1.05rem; }
  .cat-tile-top { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; }
  .cat-tile-top .group-name { flex: 1; min-width: 0; }
  .cat-tile-top .group-count { flex: 0 0 auto; white-space: nowrap; }
  /* (2026-10-07) Numbers-screen cards have a sentence, not a short count, on
     the right - on a narrow phone it squeezed the title into a column and
     ran over it (Pixel 10 Pro XL). Stacked: title, then the description. */
  .cat-tile-top.cat-tile-top-stack { flex-direction: column; align-items: flex-start; gap: 3px; }
  .cat-tile-top.cat-tile-top-stack .group-count { white-space: normal; }
  .cat-bar {
    display: flex; height: 8px; border-radius: 99px; overflow: hidden;
    background: var(--surface2); cursor: pointer;
  }
  .cat-bar .seg { height: 100%; min-width: 3px; }
  /* Category cards need a flex row (text left, swatch right) to
     hold this - scoped to #match-category-list only so the unrelated
     "Random reading" card (also .match-card-select, but plain stacked text,
     sits just below the list) isn't affected. */
  #match-category-list .match-card-select { display: flex; align-items: center; justify-content: space-between; }
  .group-name { font-size: 15px; font-weight: 700; }
  .group-count { font-size: 12px; font-weight: 600; color: var(--text-dim); }

  .toggle {
    width: 40px; height: 22px; border-radius: 99px;
    background: var(--surface2); border: 1px solid var(--border);
    position: relative; transition: background 0.2s;
    flex-shrink: 0;
  }
  .toggle::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--text-dim); transition: all 0.2s;
  }
  .group-card.selected .toggle { background: var(--accent); border-color: var(--accent); }
  .group-card.selected .toggle::after { left: 21px; background: #0f0f0f; }

  .start-btn {
    padding: 14px; border-radius: var(--radius); width: 100%;
    background: var(--accent); border: none; color: #0f0f0f;
    font-size: 16px; font-weight: 700; cursor: pointer;
    transition: opacity 0.15s;
  }
  .start-btn:hover { opacity: 0.88; }
  .start-btn:disabled { opacity: 0.35; cursor: default; }

  /* Drill screen */
  .progress-wrap { display: flex; align-items: center; gap: 12px; }
  .progress-bar-bg { flex: 1; height: 3px; background: var(--surface2); border-radius: 99px; }
  .progress-bar-fill { height: 3px; border-radius: 99px; background: var(--accent); transition: width 0.3s; }
  .progress-label { font-size: 12px; font-weight: 600; color: var(--text-dim); white-space: nowrap; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 2.5rem 2rem;
    text-align: center;
  }
  .type-badge {
    display: inline-block; font-size: 11px; padding: 3px 10px;
    border-radius: 99px; margin-bottom: 1.25rem;
    border: 1px solid;
  }
  .type-base { color: var(--text-muted); border-color: var(--border); }

  .char-display { font-size: 100px; line-height: 1; margin-bottom: 0.5rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
  /* Small tsu (っ/ッ) and the second character of youon/loanword combos
     (きゃ, ファ etc) - sized relative to whatever font-size they land in,
     via em, so this works the same whether it's a 100px char-display or a
     15px reference row. See escapeHtmlText() in the script for where this
     is applied. */
  .alt-form { font-size: 13px; font-weight: 600; color: var(--accent); text-align: center; margin-top: 0.15rem; margin-bottom: 0.5rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  /* Materials-only "seen in context" card (see q-context-card in
     renderQuestion) - a separate card between the main drill card and Next,
     not a section inside the main card itself. Used to sit inline on the
     main card (between the character and the audio button), which crowded
     out the character on longer seenAs entries, and got duplicated down
     near the feedback text so it would still be visible post-answer without
     scrolling back up. Moving it to its own card between the feedback text
     and Next solves both at once - it's out of the way of the character,
     and it's still the next thing in view after answering, so the feedback
     duplication (formerly .feedback-seen-as) is gone, not just relocated.
     Shown from question-load, not gated on answering - it's real-world
     context, not the answer, so it's not a spoiler. */
  .context-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 1rem 1.25rem; text-align: left;
  }
  .context-card-label {
    font-size: 11px; font-weight: 700; letter-spacing: 0.03em;
    text-transform: uppercase; color: var(--text-dim); margin-bottom: 0.5rem;
  }
  .seen-as-text { font-size: 13px; color: var(--text-muted); line-height: 1.45; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  /* Marks where the drilled word sits within its own example sentence (see
     findSeenAsHighlightRange/renderSeenAsHtml) - not every entry finds a
     match (conjugated verbs partially do via the stripped-ending fallback,
     a handful of template/meta-note entries don't at all), so this only
     ever adds emphasis, never required for the sentence to make sense. */
  mark.seen-as-highlight {
    background: var(--accent-dim); color: var(--accent); font-weight: 600;

    background: transparent; border: 1px solid var(--border);

    /* No line-height was ever set here, so a label short enough to stay on
       one line (true for most of these cards) looked fine on the browser
       default alone - but a longer one that wraps on a narrow phone (the
       Grammar notes hub's "Object-taking verbs" label, flagged on a Pixel
       10 Pro XL) had its two lines sitting right on top of each other,
       crushed rather than just wrapped. 1.35 matches the value .opt (the
       multiple-choice answer cards) already uses for the same reason -
       gives wrapped text room to breathe without changing this card's
       height at all when the label fits on one line, which is still most
       of them. */
    line-height: 1.35;

     barely-there default border reads as unbalanced against that centred
     text below it. Gold border always on here (not just :hover) rather
     than changing alignment or anything else - the full-width highlight is
     what restores the balance, scoped to this one container so every other
     .vocab-ref-card (Grammar notes hub, the two notes links, etc.) keeps
     its normal subtle-until-hovered look. */
  #vocab-tile-selection-ref-links .vocab-ref-card { border-color: var(--accent); }

     rule fires on tap but never gets a "pointer left" event to clear it
     afterward, so the button stays stuck fully gold until something else
     is tapped. :active above still gives a touch tap its own momentary
     feedback, which clears itself the instant the tap ends. */
  
  .match-card-select .group-count { font-size: 12px; font-weight: 600; color: var(--text-dim); margin-top: 3px; }

  #vocab-level-filter-row .level-pill, #verbs-level-row .level-pill { padding: 6px 14px; }
  #vocab-level-filter-row .level-pill.level-pill-icon, #verbs-level-row .level-pill.level-pill-icon { padding: 5px 10px; display: inline-flex; align-items: center; justify-content: center; }

  /* Pill-shaped search field - same 99px radius/border language as
     .level-pill, but a text input + submit icon instead of a button. flex:1
     so it fills the row. Border is gold permanently, not just while focused -
     unlike every other input in the app, this is meant to read as a standing
     feature of the page, not something that only lights up while in use. */
  .vocab-search-pill {
    flex: 1; min-width: 0; display: flex; align-items: center;
    border: 1px solid var(--accent); border-radius: 99px;
    background: transparent; padding-left: 14px; padding-right: 4px;

  .vocab-search-clear {

  .vocab-search-btn {

  /* font-family set explicitly, as on .nav-pill: without it a pill falls
     through to the system font stack. */
  .level-pill {
    padding: 6px 18px; border-radius: 99px; border: 1px solid var(--border);
    background: transparent; color: var(--text-muted);
    font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
